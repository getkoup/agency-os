name: Synchronization worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: synchronization-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process-pending-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Process pending synchronization targets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CRON_SECRET}"
          curl \
            --fail-with-body \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 290 \
            --retry 2 \
            --retry-delay 5 \
            --show-error \
            --silent \
            https://agency.getkoup.com/api/cron/synchronization
