name: Production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_MKojyw1P5Bz0FoifeVpdTSGl
  VERCEL_PROJECT_ID: prj_RrX5nk3EA9RXB3Bx9ruC0oOVGqt4

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Require Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "${VERCEL_TOKEN}"

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@58.1.0 deploy --yes --prod --token="${VERCEL_TOKEN}"
